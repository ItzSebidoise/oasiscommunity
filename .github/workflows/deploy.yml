name: Deploy Lovable App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Vytvoří .nojekyll, aby GitHub neignoroval složky s podtržítkem
      - name: Add .nojekyll
        run: touch ./dist/.nojekyll || touch ./build/.nojekyll || true

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Vyzkouší dist, a pokud neexistuje, použije build
          path: ${{ hashFiles('dist/**') != '' && './dist' || './build' }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
