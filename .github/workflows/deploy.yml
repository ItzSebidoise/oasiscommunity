name: Deploy Lovable App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Diagnostika: Vypíše vytvořené složky po buildu
      - name: Check build folder
        run: |
          echo "=== Soubory v kořeni projektu ==="
          ls -la
          echo "=== Hledám složku s buildem ==="
          if [ -d "dist" ]; then echo "BUILD_PATH=dist" >> $GITHUB_ENV;
          elif [ -d "build" ]; then echo "BUILD_PATH=build" >> $GITHUB_ENV;
          elif [ -d "out" ]; then echo "BUILD_PATH=out" >> $GITHUB_ENV;
          else echo "BUILD_PATH=." >> $GITHUB_ENV; fi

      - name: Add .nojekyll
        run: touch ./${{ env.BUILD_PATH }}/.nojekyll

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './${{ env.BUILD_PATH }}'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
