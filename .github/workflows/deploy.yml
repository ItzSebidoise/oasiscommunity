name: Deploy Lovable App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Vypíše přesnou strukturu po buildu, abychom viděli složku dist/build
      - name: Debug build output
        run: |
          echo "=== Zobrazuji vytvořené složky ==="
          ls -la

      - name: Fix fallback directory
        run: |
          if [ -d "dist" ]; then
            echo "DEPLOY_DIR=dist" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "DEPLOY_DIR=build" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=." >> $GITHUB_ENV
          fi

      - name: Add .nojekyll
        run: touch ./${{ env.DEPLOY_DIR }}/.nojekyll

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Výchozí složka pro Vite

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
